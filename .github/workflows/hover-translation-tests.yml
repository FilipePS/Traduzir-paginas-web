name: Hover translation privacy checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hover-translation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - run: node --test tests/hover-translation.test.cjs
